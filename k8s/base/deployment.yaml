apiVersion: apps/v1
kind: Deployment
metadata:
  name: wf-app
  namespace: writersfund
  labels:
    app: wf-app
    app.kubernetes.io/name: wf-app
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wf-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: wf-app
        app.kubernetes.io/name: wf-app
        app.kubernetes.io/component: backend
    spec:
      tolerations:
        - key: node.kubernetes.io/network-unavailable
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/network-unavailable
          operator: Exists
          effect: NoExecute
      imagePullSecrets:
        - name: regcred
      containers:
        - name: wf-app
          image: wf-app:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: wf-app-env
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "0.5"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
